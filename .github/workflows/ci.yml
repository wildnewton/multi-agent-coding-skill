name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python 3.10 + 3.13
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Run Python 3.10 checks
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q run_codex.py tests/smoke_long_running_invocation.py

      - name: Set up Python 3.13
        if: always()
        id: setup313
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run Python 3.13 checks
        if: always() && steps.setup313.outcome == 'success'
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q run_codex.py tests/smoke_long_running_invocation.py
